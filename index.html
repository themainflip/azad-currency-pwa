<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مبدل ارز پیشرفته - بازار آزاد</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تبدیل ارز">
    
    <!-- Tailwind CSS (CDN for zero-build setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link id="dynamic-manifest" rel="manifest" href="">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-card {
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.6);
        }
        /* Clean UI: Hide arrows on number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4">

    <!-- App Container -->
    <main class="w-full max-w-md bg-white rounded-3xl p-6 ios-card relative overflow-hidden">
        
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">تبدیل ارز (بازار آزاد)</h1>
            <p class="text-xs mt-2 font-medium transition-colors text-blue-500" id="last-update">در حال دریافت داده...</p>
        </header>

        <!-- Amount Input -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 mb-2 px-1">مبلغ</label>
            <input type="number" id="amount" value="1" min="0" step="any"
                class="w-full bg-gray-50 rounded-xl px-4 py-3 text-left text-2xl font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all border border-gray-200" 
                style="direction: ltr;" placeholder="0">
        </div>

        <!-- Currencies Selectors & Swap -->
        <div class="relative bg-white rounded-2xl p-4 mb-6 border border-gray-100 shadow-sm flex flex-col gap-4">
            
            <!-- From Currency -->
            <div class="flex justify-between items-center z-10 relative">
                <span class="text-sm font-medium text-gray-400 w-12">از</span>
                <select id="from-currency" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full ml-2 text-left appearance-none cursor-pointer" dir="ltr">
                    <option value="USD">🇺🇸 USD - Dollar</option>
                    <option value="AFN">🇦🇫 AFN - Afghani</option>
                    <option value="TOMAN">🇮🇷 IRT - Toman</option>
                </select>
            </div>

            <!-- Swap Button -->
            <div class="relative h-2 w-full flex justify-center items-center z-20">
                <button type="button" id="swap-btn" class="absolute bg-blue-600 text-white rounded-full p-2.5 shadow-md hover:bg-blue-700 active:scale-90 transition-all duration-300 border-4 border-white cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="19 12 12 19 5 12"></polyline>
                    </svg>
                </button>
            </div>

            <!-- To Currency -->
            <div class="flex justify-between items-center z-10 relative">
                <span class="text-sm font-medium text-gray-400 w-12">به</span>
                <select id="to-currency" class="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full ml-2 text-left appearance-none cursor-pointer" dir="ltr">
                    <option value="TOMAN">🇮🇷 IRT - Toman</option>
                    <option value="AFN">🇦🇫 AFN - Afghani</option>
                    <option value="USD">🇺🇸 USD - Dollar</option>
                </select>
            </div>
        </div>

        <!-- Result -->
        <div class="bg-blue-50 rounded-2xl p-5 text-center border border-blue-100">
            <p class="text-xs text-blue-400 font-bold mb-2">معادل</p>
            <div class="text-3xl font-extrabold text-blue-700 break-words" id="result-display" style="direction: ltr;">
                0
            </div>
        </div>
        
        <!-- Notes -->
        <div class="mt-6 text-center text-[10px] text-gray-400 leading-relaxed">
            محاسبات هوشمند (مقاوم در برابر VPN)
        </div>
    </main>

    <script>
        /**
         * System State (Includes realistic fallbacks if network is entirely down on first run)
         */
        const state = {
            rates: { USD: 1, AFN: 68.5, TOMAN: 60000 }, 
            amount: 1,
            from: 'USD',
            to: 'TOMAN'
        };

        const DOM = {
            amount: document.getElementById('amount'),
            fromSelect: document.getElementById('from-currency'),
            toSelect: document.getElementById('to-currency'),
            swapBtn: document.getElementById('swap-btn'),
            resultDisplay: document.getElementById('result-display'),
            lastUpdate: document.getElementById('last-update')
        };

        /**
         * Custom Fetch with Timeout to prevent hanging connections (e.g. Proxy delays)
         */
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 5000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(resource, {
                ...options,
                signal: controller.signal  
            });
            clearTimeout(id);
            return response;
        }

        /**
         * Core Engine: Independent Data Fetching (Fault Tolerant)
         */
        async function fetchRates() {
            DOM.lastUpdate.innerText = 'در حال ارتباط با سرورها...';
            DOM.lastUpdate.className = 'text-xs mt-2 font-medium transition-colors text-blue-500';

            // Load cache if available
            const cached = localStorage.getItem('marketRatesCacheV2');
            if (cached) {
                state.rates = JSON.parse(cached);
            }

            let isGlobalSuccess = false;
            let isLocalSuccess = false;

            // 1. Fetch Global Rates (Isolated Try/Catch)
            try {
                const afnRes = await fetchWithTimeout('https://open.er-api.com/v6/latest/USD');
                if (afnRes.ok) {
                    const globalData = await afnRes.json();
                    state.rates.AFN = globalData.rates.AFN;
                    isGlobalSuccess = true;
                }
            } catch (error) {
                console.warn('Global API Failed (Possibly VPN blocked):', error);
            }

            // 2. Fetch Iranian Market Toman (Isolated Try/Catch)
            try {
                const tomanRate = await getFreeMarketToman();
                if (tomanRate) {
                    state.rates.TOMAN = tomanRate;
                    isLocalSuccess = true;
                }
            } catch (error) {
                console.warn('Local API Failed (Possibly VPN IP Drop):', error);
            }

            // 3. Status Evaluation & UI Update
            if (isGlobalSuccess || isLocalSuccess) {
                localStorage.setItem('marketRatesCacheV2', JSON.stringify(state.rates));
                
                if (isGlobalSuccess && isLocalSuccess) {
                    DOM.lastUpdate.innerText = 'بروزرسانی کامل: ' + new Date().toLocaleTimeString('fa-IR');
                    DOM.lastUpdate.classList.replace('text-blue-500', 'text-green-500');
                } else {
                    DOM.lastUpdate.innerText = 'بروزرسانی جزئی (VPN را بررسی کنید)';
                    DOM.lastUpdate.classList.replace('text-blue-500', 'text-orange-500');
                }
            } else {
                DOM.lastUpdate.innerText = 'استفاده از نرخ‌های آفلاین/تخمینی';
                DOM.lastUpdate.classList.replace('text-blue-500', 'text-red-500');
            }

            calculate();
        }

        // Strategy Pattern for fetching Toman from volatile sources
        async function getFreeMarketToman() {
            try {
                const res = await fetchWithTimeout('https://brsapi.ir/FreeTsetmcBourseApi/Api_Free_Gold_Currency.json', { timeout: 4000 });
                if(res.ok) {
                    const data = await res.json();
                    if (data?.currency) {
                        const dollar = data.currency.find(c => c.name.includes('دلار'));
                        if (dollar?.price) return dollar.price > 100000 ? dollar.price / 10 : dollar.price;
                    }
                }
            } catch(e) {
                // Silently fallback to proxy
            }

            try {
                const proxy = 'https://api.allorigins.win/get?url=';
                const tgju = 'https://api.tgju.org/v1/widget/live';
                const res = await fetchWithTimeout(proxy + encodeURIComponent(tgju), { timeout: 6000 });
                if(res.ok) {
                    const json = await res.json();
                    const data = JSON.parse(json.contents);
                    if (data?.price_dollar_rl?.v) {
                        return parseFloat(data.price_dollar_rl.v.replace(/,/g, '')) / 10;
                    }
                }
            } catch(e) {
                // Both failed
            }
            return null;
        }

        // Mathematical Operations
        function calculate() {
            const amount = parseFloat(DOM.amount.value) || 0;
            const rateFrom = state.rates[state.from];
            const rateTo = state.rates[state.to];

            if(!rateFrom || !rateTo) return;

            const finalResult = (amount / rateFrom) * rateTo;
            const fractionDigits = state.to === 'TOMAN' ? 0 : 2; 
            
            DOM.resultDisplay.innerText = new Intl.NumberFormat('en-US', { 
                maximumFractionDigits: fractionDigits 
            }).format(finalResult);
        }

        // Event Bindings
        function initEvents() {
            DOM.amount.addEventListener('input', (e) => { state.amount = e.target.value; calculate(); });
            DOM.fromSelect.addEventListener('change', (e) => { state.from = e.target.value; calculate(); });
            DOM.toSelect.addEventListener('change', (e) => { state.to = e.target.value; calculate(); });

            DOM.swapBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const temp = state.from;
                state.from = state.to;
                state.to = temp;

                DOM.fromSelect.value = state.from;
                DOM.toSelect.value = state.to;
                
                DOM.swapBtn.classList.add('rotate-180');
                setTimeout(() => DOM.swapBtn.classList.remove('rotate-180'), 300);

                calculate();
            });

            window.addEventListener('online', fetchRates);
        }

        // PWA Setup (Simplified for cleaner codebase)
        function setupPWA() {
            const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#2563EB"/><text x="50%" y="50%" font-size="280" fill="white" font-family="Arial" font-weight="bold" dominant-baseline="middle" text-anchor="middle">$</text></svg>`;
            const iconDataUrl = 'data:image/svg+xml;base64,' + btoa(iconSvg);
            const manifest = {
                name: "مبدل ارز", short_name: "مبدل ارز", start_url: window.location.href,
                display: "standalone", background_color: "#f3f4f6", theme_color: "#2563EB",
                icons: [{ src: iconDataUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
            };
            document.getElementById('dynamic-manifest').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));

            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'currency-v4';
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => clients.claim());
                    self.addEventListener('fetch', e => {
                        if (e.request.url.includes('api.com') || e.request.url.includes('brsapi') || e.request.url.includes('allorigins')) return;
                        e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
                    });
                `;
                navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' })));
            }
        }

        // Boot
        initEvents();
        fetchRates();
        setupPWA();
    </script>
</body>
</html>
